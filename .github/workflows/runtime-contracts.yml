name: runtime-contracts
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  runtime-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --only-binary :all: jsonschema==4.25.1 pytest==9.1.1
      - run: python -m pytest tests/runtime_contracts -q
