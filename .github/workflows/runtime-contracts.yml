name: runtime-contracts
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  runtime-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: 'pip --disable-pip-version-check install --no-index --only-binary :all: --find-links tools/structural-test-wheels --require-hashes -r contracts/structural-test-requirements.txt'
      - run: python -m pytest tests/runtime_contracts -q
      - name: Verify provider-copy boundaries and forged-input refusals
        run: python -m unittest discover -s tests -p test_openspec_consumer_boundaries.py
